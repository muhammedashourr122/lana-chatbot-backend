<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lana Beauty — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/dashboard.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div>
      <h1>Lana Beauty Dashboard</h1>
      <p class="sub">Business health, delivery performance, and orders <span id="refresh-note"></span></p>
    </div>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Order number or phone number" />
      <button id="search-btn">Search</button>
    </div>
    <a href="/admin/homepage-builder" id="homepage-builder-link" style="display:none;">Homepage Builder</a>
    <div id="user-menu" style="display:flex;align-items:center;gap:10px;"></div>
  </div>
</div>

<div class="page">
  <div class="tabs" id="dash-tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="attention">Needs Attention<span id="attention-count-badge"></span></button>
    <button class="tab-btn" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
    <button class="tab-btn" data-tab="users" id="tab-btn-users" style="display:none;">Users & Roles</button>
  </div>

  <div id="search-results"></div>
  <div id="customer-panel" style="display:none;margin-bottom:20px;"></div>

  <div class="tab-panel" data-tab-panel="overview">
    <div id="overview-root"><div class="skeleton"></div></div>
    <div id="governorates-root"></div>
    <div id="top-products-root"></div>
  </div>

  <div class="tab-panel" data-tab-panel="attention" style="display:none;">
    <div id="attention-root"></div>
  </div>

  <div class="tab-panel" data-tab-panel="orders" style="display:none;">
    <div id="orders-root"></div>
  </div>

  <div class="tab-panel" data-tab-panel="settings" style="display:none;">
    <div id="settings-root"></div>
  </div>

  <div class="tab-panel" data-tab-panel="users" style="display:none;">
    <div id="users-root"></div>
  </div>
</div>

<script type="module" src="/admin/dashboard.js"></script>
</body>
</html>
