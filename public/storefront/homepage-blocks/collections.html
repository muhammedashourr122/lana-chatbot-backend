<style>
/* =========================================================
   LANA'S BEAUTY
   SHOP BY COLLECTION — V4.4
   FULL WIDTH / EDITORIAL POLISH
   (content populated by homepage.js — data-field attributes)
========================================================= */

.lana-collections {
  width: 100%;
  max-width: none;

  background: #fff;

  padding: 68px 20px 66px;

  box-sizing: border-box;
}

.lana-collections * {
  box-sizing: border-box;
}


/* =========================================================
   INNER — FULL WIDTH
========================================================= */

.lana-collections-inner {
  width: 100%;
  max-width: none;

  margin: 0 auto;
}


/* =========================================================
   HEADER
========================================================= */

.lana-collections-header {
  text-align: center;

  margin-bottom: 40px;
}

.lana-collections-kicker {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 12px;

  margin-bottom: 12px;

  color: #8a6573;

  font-size: 8px;
  font-weight: 700;

  letter-spacing: 3.4px;
  line-height: 1;

  text-transform: uppercase;
}

.lana-collections-kicker::before,
.lana-collections-kicker::after {
  content: "";

  width: 27px;
  height: 1px;

  background: #d8c7cd;
}

.lana-collections-title {
  margin: 0;

  color: #211c1f;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 48px;
  line-height: .98;

  font-weight: 400;

  letter-spacing: -1.7px;
}

.lana-collections-title em {
  color: #8a6573;

  font-style: italic;
}

.lana-collections-subtitle {
  max-width: 430px;

  margin: 14px auto 0;

  color: #777074;

  font-size: 10px;

  line-height: 1.72;

  letter-spacing: .05px;
}


/* =========================================================
   GRID — WIDE
========================================================= */

.lana-collections-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 20px;

  width: 100%;

  max-width: 1200px;

  margin: 0 auto;
}


/* =========================================================
   CARD
========================================================= */

.lana-collection-card {
  position: relative;

  display: block;

  width: 100%;
  height: 430px;

  overflow: hidden;

  color: inherit;

  text-decoration: none !important;

  border-radius: 24px;

  background: #eee;

  border:
    1px solid rgba(43,31,36,.09);

  isolation: isolate;

  box-shadow:
    0 12px 32px rgba(52,35,42,.055);
}


/* =========================================================
   IMAGE
========================================================= */

.lana-collection-product {
  position: absolute;

  inset: 0;

  z-index: 1;

  width: 100%;
  height: 100%;

  object-fit: cover;

  object-position: center;

  transform: scale(1.012);

  transition:
    transform 1s cubic-bezier(.2,.7,.2,1),
    filter 1s ease;
}


/* =========================================================
   FOR HER OVERLAY
========================================================= */

.lana-collection-card.her::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025) 0%,
      rgba(255,255,255,0) 43%,
      rgba(116,76,89,.07) 59%,
      rgba(102,63,77,.30) 80%,
      rgba(83,50,61,.56) 100%
    );
}


/* =========================================================
   FOR HIM OVERLAY
========================================================= */

.lana-collection-card.him::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025) 0%,
      rgba(255,255,255,0) 43%,
      rgba(83,77,73,.07) 59%,
      rgba(71,65,62,.30) 80%,
      rgba(63,57,54,.56) 100%
    );
}


/* =========================================================
   UNISEX OVERLAY
========================================================= */

.lana-collection-card.unisex::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025) 0%,
      rgba(255,255,255,0) 43%,
      rgba(105,86,72,.06) 59%,
      rgba(88,70,58,.27) 80%,
      rgba(72,58,49,.53) 100%
    );
}


/* =========================================================
   SOFT LIGHT
========================================================= */

.lana-collection-card.her::after,
.lana-collection-card.him::after,
.lana-collection-card.unisex::after {
  content: "";

  position: absolute;

  top: -20%;
  left: 50%;

  z-index: 2;

  width: 72%;
  height: 55%;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.28) 0%,
      rgba(255,255,255,0) 70%
    );

  pointer-events: none;
}


/* =========================================================
   INNER FRAME
========================================================= */

.lana-collection-frame {
  position: absolute;

  inset: 7px;

  z-index: 6;

  border:
    1px solid rgba(255,255,255,.46);

  border-radius: 19px;

  pointer-events: none;

  transition:
    inset .55s cubic-bezier(.2,.7,.2,1),
    border-color .55s ease;
}


/* =========================================================
   INFO
========================================================= */

.lana-collection-info {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 5;

  padding:
    0
    25px
    25px;

  text-align: center;

  text-shadow:
    0 2px 12px rgba(55,38,45,.18);
}


/* =========================================================
   LABEL
========================================================= */

.lana-collection-label {
  margin-bottom: 8px;

  color: rgba(255,255,255,.87);

  font-size: 7px;

  font-weight: 700;

  letter-spacing: 2.3px;
  line-height: 1.2;

  text-transform: uppercase;
}


/* =========================================================
   NAME
========================================================= */

.lana-collection-name {
  margin: 0;

  color: #fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 39px;

  line-height: .94;

  font-weight: 400;

  letter-spacing: -1px;

  transition:
    transform .5s ease;
}


/* =========================================================
   CTA
========================================================= */

.lana-collection-shop {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 9px;

  margin-top: 15px;

  padding:
    0
    0
    7px;

  border-bottom:
    1px solid rgba(255,255,255,.66);

  color: rgba(255,255,255,.96);

  font-size: 7px;

  font-weight: 700;

  letter-spacing: 1.8px;
  line-height: 1;

  text-transform: uppercase;

  transition:
    gap .45s ease,
    border-color .45s ease;
}

.lana-collection-arrow {
  font-size: 11px;

  line-height: 1;

  transition:
    transform .45s ease;
}


/* =========================================================
   HOVER
========================================================= */

.lana-collection-card:hover
.lana-collection-product {
  transform: scale(1.052);
}

.lana-collection-card:hover
.lana-collection-name {
  transform: translateY(-3px);
}

.lana-collection-card:hover
.lana-collection-shop {
  gap: 13px;

  border-color: #fff;
}

.lana-collection-card:hover
.lana-collection-arrow {
  transform: translateX(3px);
}

.lana-collection-card:hover
.lana-collection-frame {
  inset: 10px;

  border-color:
    rgba(255,255,255,.70);
}


/* =========================================================
   TABLET
========================================================= */

}


/* =========================================================

/* =========================================================
