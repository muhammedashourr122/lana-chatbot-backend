<style>
/* =========================================================
   LANA'S BEAUTY — LUXURY ANNOUNCEMENT BAR
   (content populated by homepage.js — data-field attributes)
   ========================================================= */

.lana-announcement {
  width: 100%;
  background: #6C4452;
  color: #ffffff;
  overflow: hidden;
  position: relative;
  z-index: 9999;
  font-family: Arial, Helvetica, sans-serif;
  box-sizing: border-box;
}

.lana-announcement-track {
  position: relative;
  width: 100%;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lana-announcement-item {
  position: absolute;

  top: 50%;

  padding: 0 20px;
  box-sizing: border-box;
  text-align: center;
  white-space: nowrap;

  transform: translate(-50%, -50%);
  opacity: 0;

  font-size: 11px;

  letter-spacing: 1.05px;
  line-height: 1;

  animation: lanaAnnouncement 12s infinite;
}


/* =========================================================
   INDIVIDUAL TIMING
   ========================================================= */

.lana-announcement-item:nth-child(1) {
  animation-delay: 0s;
}

.lana-announcement-item:nth-child(2) {
  animation-delay: 4s;
}

.lana-announcement-item:nth-child(3) {
  animation-delay: 8s;
}


/* =========================================================
   ELEGANT FADE
   ========================================================= */

@keyframes lanaAnnouncement {

  0% {
    opacity: 0;
    transform: translate(-50%, -50%) translateY(5px);
  }
